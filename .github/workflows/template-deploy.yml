# This workfname: Build and deploy
on: push

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build_id: ${{ steps.build_step.outputs.build_id }}
    steps:
      - name: Build
        id: build_step
        run: echo "build_id=$RANDOM" >> $GITHUB_OUTPUT
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploying build ${{ needs.build.outputs.build_id }}"
  debug:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    if: ${{ failure() }}
    steps:
      - run: echo "Failed to build and deploy"
      low contains steps which execute when template is converted to a repository

name: template-deploy

on:
  create:
    ref: main
    ref_type: branch

permissions:
  contents: write
  issues: write

jobs:
  # Add issue labels expected by the repository
  add-repo-labels:
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            let labels = [
              'jenkins',
              'azure-devops',
              'circle-ci',
              'gitlab',
              'travis-ci',
              'bamboo',
              'actions-importer-running'
            ];

            labels.forEach( (label) => {
              github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: '00FFFF',
                description: 'Label used by Issue Ops workflow.'
              });
            });
